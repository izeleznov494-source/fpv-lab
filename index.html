<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FPV Лаборатория</title>
    <style>
        /* --- СТИЛИ --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0e1621; /* Темный фон */
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* ЛЕВАЯ ПАНЕЛЬ */
        .sidebar {
            width: 320px;
            background: #17212b;
            border-right: 1px solid #242f3d;
            display: flex;
            flex-direction: column;
        }

        .logo {
            padding: 20px;
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            border-bottom: 1px solid #242f3d;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        /* ПРАВАЯ ПАНЕЛЬ */
        .main-content {
            flex: 1;
            background: #0e1621;
            overflow-y: auto;
            padding: 40px;
        }

        .content-wrapper {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 32px;
            color: #ffffff;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #94a3b8;
        }

        /* СТИЛИ МЕНЮ */
        .folder { margin-bottom: 5px; }

        .folder-header {
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 14px;
            color: #94a3b8;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .folder-header:hover {
            background: #202b36;
            color: #fff;
        }

        .folder-header .arrow {
            margin-left: auto;
            font-size: 10px;
            transition: transform 0.3s;
        }

        .folder.open > .folder-header .arrow {
            transform: rotate(90deg);
        }

        .folder.open > .folder-header {
            color: #64b5f6;
        }

        .folder-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            padding-left: 15px;
        }

        .doc {
            padding: 10px 15px 10px 25px;
            color: #64748b;
            cursor: pointer;
            font-size: 13px;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .doc:hover {
            color: #fff;
            background: #202b36;
        }

        .doc::before {
            content: '📄';
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <span>🚁</span> FPV LAB
            </div>
            <div class="menu-list" id="sidebar-menu"></div>
        </aside>

        <main class="main-content">
            <div class="content-wrapper">
                <h1 id="reader-title">Добро пожаловать</h1>
                <p id="reader-content">Выберите тему в меню слева, чтобы начать.</p>
            </div>
        </main>
    </div>

    <script>
        // --- ЛОГИКА ---
        const structure = [
            { title: "1. Основные компоненты", children: [
                { title: "Рама", children: [{ title: "Рама" }] },
                { title: "Моторы", children: [{ title: "Моторы" }] },
                { title: "ESC", children: [{ title: "ESC" }] }
            ]},
            { title: "2. Режимы", children: [
                { title: "Angle Mode", children: [{ title: "Angle Mode" }] },
                { title: "Acro Mode", children: [{ title: "Acro Mode" }] }
            ]}
        ];

        const sidebarMenu = document.getElementById('sidebar-menu');
        const readerTitle = document.getElementById('reader-title');
        const readerContent = document.getElementById('reader-content');

        function renderMenu(items, container, level = 0) {
            items.forEach(item => {
                if (item.children) {
                    const folder = document.createElement('div');
                    folder.className = 'folder';
                    
                    const header = document.createElement('div');
                    header.className = 'folder-header';
                    header.innerHTML = `<span>📁</span><span>${item.title}</span><span class="arrow">▶</span>`;
                    
                    const content = document.createElement('div');
                    content.className = 'folder-content';
                    
                    header.addEventListener('click', (e) => {
                        e.stopPropagation();
                        folder.classList.toggle('open');
                        if(!folder.classList.contains('open')) {
                            content.style.maxHeight = null;
                        } else {
                            content.style.maxHeight = content.scrollHeight + "px";
                        }
                    });
                    
                    folder.appendChild(header);
                    folder.appendChild(content);
                    container.appendChild(folder);
                    
                    renderMenu(item.children, content, level + 1);
                } else {
                    const doc = document.createElement('div');
                    doc.className = 'doc';
                    doc.innerHTML = `<span></span> <span>${item.title}</span>`;
                    
                    doc.addEventListener('click', (e) => {
                        e.stopPropagation();
                        readerTitle.textContent = item.title;
                        readerContent.textContent = `Тут будет содержимое: ${item.title}.docx`;
                    });
                    container.appendChild(doc);
                }
            });
        }

        renderMenu(structure, sidebarMenu);
    </script>
</body>
</html>
