<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FPV Лаборатория</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
        body { background-color: #0e1621; color: #fff; height: 100vh; overflow: hidden; display: flex; }
        
        .menu-btn { display: none; position: fixed; top: 15px; left: 15px; z-index: 100; background: #17212b; color: #64b5f6; border: 1px solid #242f3d; padding: 10px 15px; font-size: 20px; border-radius: 8px; cursor: pointer; }
        .sidebar { width: 320px; background: #17212b; border-right: 1px solid #242f3d; display: flex; flex-direction: column; transition: transform 0.3s; z-index: 50; }
        .logo { padding: 20px; font-size: 20px; font-weight: 900; border-bottom: 1px solid #242f3d; display: flex; align-items: center; gap: 10px; }
        .menu-list { flex: 1; overflow-y: auto; padding: 10px; }
        .main-content { flex: 1; background: #0e1621; overflow-y: auto; padding: 40px; position: relative; }
        .content-wrapper { max-width: 800px; margin: 0 auto; background: rgba(23, 33, 43, 0.8); padding: 30px; border-radius: 12px; border: 1px solid #242f3d; }
        h1 { font-size: 32px; margin-bottom: 15px; color: #64b5f6; }
        p { font-size: 16px; line-height: 1.6; color: #94a3b8; }
        
        .folder { margin-bottom: 2px; }
        .folder-header { padding: 12px 15px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; color: #94a3b8; border-radius: 8px; transition: all 0.2s; }
        .folder-header:hover { background: #202b36; color: #fff; }
        .folder-header .arrow { margin-left: auto; font-size: 10px; transition: transform 0.3s; }
        .folder.open > .folder-header .arrow { transform: rotate(90deg); }
        .folder.open > .folder-header { color: #64b5f6; }
        .folder-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; padding-left: 15px; }
        
        .doc { padding: 10px 15px 10px 25px; color: #64748b; cursor: pointer; font-size: 13px; border-radius: 6px; transition: all 0.2s; display: flex; align-items: center; gap: 10px; }
        .doc:hover { color: #fff; background: #202b36; }
        .doc::before { content: '📄'; font-size: 12px; }
        .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 40; }

        @media (max-width: 768px) {
            .menu-btn { display: block; }
            .sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { padding: 60px 15px 15px 15px; }
            .content-wrapper { padding: 20px; }
        }
    </style>
</head>
<body>
    <button id="menu-toggle" class="menu-btn">☰</button>
    <div id="overlay" class="overlay"></div>
    
    <aside id="sidebar" class="sidebar">
        <div class="logo"><span>🚁</span> FPV LAB</div>
        <div class="menu-list" id="sidebar-menu"></div>
    </aside>

    <main class="main-content">
        <div class="content-wrapper">
            <h1 id="reader-title">Добро пожаловать</h1>
            <p id="reader-content">Выберите тему в меню слева, чтобы начать.</p>
        </div>
    </main>

    <script>
        // ТУТ ВСЕ 10 ТЕМ И ИХ ДОКУМЕНТЫ
        const structure = [
            { title: "1. Основные компоненты и архитектура", children: ["Рама", "Моторы", "ESC", "FC", "VTX", "FPV-камера", "Приёмник", "Антенны", "Пропеллеры", "PDB / BEC"] },
            { title: "2. Полётные режимы и управление", children: ["Angle Mode", "Horizon Mode", "Acro Mode", "Air Mode", "Throttle", "Yaw", "Pitch", "Roll", "Simulator", "GPS Rescue"] },
            { title: "3. Видеосистемы и связь", children: ["Аналоговое видео", "Цифровое HD (DJI)", "Цифровое HD (HDZero)", "Задержка", "Диапазоны частот", "Мощность VTX", "Поляризация", "Очки (Goggles)", "Diversity", "Помехоустойчивость"] },
            { title: "4. Питание и аккумуляторы", children: ["LiPo", "Li-Ion", "Ячейки (S)", "Ёмкость (mAh)", "Время полёта", "Разъёмы", "Зарядка", "Хранение", "Просадки напряжения", "Риски"] },
            { title: "5. Применение", children: ["Гонки", "Фристайл", "Cinewhoop", "Long Range", "FPV-камикадзе", "Разведка", "Поиск и спасение", "Кинематограф", "Инспекция", "Обучение"] },
            { title: "6. Регулирование и безопасность", children: ["Наблюдатель (VLOS)", "Регистрация", "Экзамен", "Зоны полётов", "Высота", "Ответственность", "Помехи", "Погода", "Безопасность людей"] },
            { title: "7. Настройка и прошивки", children: ["Betaflight", "ExpressLRS", "PID", "Rates", "OSD", "CLI", "Прошивка ESC", "VTX Tables", "Режимы", "Симулятор"] },
            { title: "8. Ремонт и обслуживание", children: ["Замена пропеллера", "Перепайка мотора", "Замена рамы", "Проверка антенн", "Чистка", "Проверка винтов", "Диагностика FC", "Замена камеры", "Тест моторов", "Аккумуляторы"] },
            { title: "9. Сборка и пайка", children: ["Пайка моторов", "Пайка питания", "Пайка VTX", "Установка FC", "Проверка КЗ", "Smoke Stopper", "Антенны", "Укладка проводов", "Прошивка FC", "Тест без пропеллеров"] },
            { title: "10. Спецприменение", children: ["FPV-камикадзе", "Дальность", "Нагрузка", "Скорость", "Оптоволокно", "Ночные версии", "Дешевизна", "Маневренность", "РЭБ", "Автосопровождение"] }
        ];

        const sidebarMenu = document.getElementById('sidebar-menu');
        const readerTitle = document.getElementById('reader-title');
        const readerContent = document.getElementById('reader-content');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuToggle = document.getElementById('menu-toggle');

        function renderMenu(items, container) {
            items.forEach(item => {
                if (item.children) {
                    const folder = document.createElement('div');
                    folder.className = 'folder';
                    const header = document.createElement('div');
                    header.className = 'folder-header';
                    header.innerHTML = `<span>📁</span><span>${item.title}</span><span class="arrow">▶</span>`;
                    const content = document.createElement('div');
                    content.className = 'folder-content';
                    
                    header.addEventListener('click', (e) => {
                        e.stopPropagation();
                        folder.classList.toggle('open');
                        if(!folder.classList.contains('open')) {
                            content.style.maxHeight = null;
                        } else {
                            content.style.maxHeight = content.scrollHeight + "px";
                        }
                    });
                    
                    folder.appendChild(header);
                    folder.appendChild(content);
                    container.appendChild(folder);
                    
                    // Рендерим документы внутри папки
                    item.children.forEach(title => {
                        const doc = document.createElement('div');
                        doc.className = 'doc';
                        doc.innerHTML = `<span></span> <span>${title}</span>`;
                        doc.addEventListener('click', (e) => {
                            e.stopPropagation();
                            readerTitle.textContent = title;
                            readerContent.textContent = `Тут будет содержимое файла: ${title}.docx`;
                            if(window.innerWidth <= 768) { sidebar.classList.remove('open'); overlay.style.display = 'none'; }
                        });
                        content.appendChild(doc);
                    });
                }
            });
        }

        menuToggle.addEventListener('click', () => { sidebar.classList.add('open'); overlay.style.display = 'block'; });
        overlay.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.style.display = 'none'; });

        renderMenu(structure, sidebarMenu);
    </script>
</body>
</html>
