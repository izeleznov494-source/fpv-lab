<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FPV Лаборатория</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
        
        body { 
            background-color: #0b0f19; 
            color: #fff; 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            user-select: none; 
            -webkit-user-select: none;
        }
        
        .menu-btn { display: none; position: fixed; top: 15px; left: 15px; z-index: 100; background: rgba(23, 33, 43, 0.8); backdrop-filter: blur(10px); color: #64b5f6; border: 1px solid #242f3d; padding: 10px 15px; font-size: 20px; border-radius: 8px; cursor: pointer; }
        
        /* ЛЕВОЕ МЕНЮ */
        .sidebar { 
            width: 340px; 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.05); 
            display: flex; 
            flex-direction: column; 
            transition: transform 0.3s; 
            z-index: 50; 
        }
        .logo { padding: 20px; font-size: 22px; font-weight: 900; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 10px; color: #fff; text-shadow: 0 0 10px rgba(100, 181, 246, 0.5); }
        .menu-list { flex: 1; overflow-y: auto; padding: 10px; }
        
        /* ПРАВАЯ ЧАСТЬ */
        .main-content { 
            flex: 1; 
            overflow-y: auto; 
            position: relative; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0b0f19;
        }

        /* КАРТИНКА ДРОНА */
        .hero-image-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            overflow: hidden;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.3;
            filter: blur(2px);
        }

        /* ТЕКСТОВЫЙ БЛОК */
        .content-wrapper { 
            position: relative;
            z-index: 2;
            max-width: 700px; 
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(15px);
            padding: 40px; 
            border-radius: 16px; 
            border: 1px solid rgba(100, 181, 246, 0.2); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            margin: 20px;
        }

        h1 { font-size: 36px; margin-bottom: 15px; color: #64b5f6; text-shadow: 0 0 20px rgba(100, 181, 246, 0.4); }
        p { font-size: 18px; line-height: 1.6; color: #cbd5e1; }
        
        /* Стили папок */
        .folder { margin-bottom: 2px; }
        .folder-header { padding: 12px 15px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; color: #94a3b8; border-radius: 8px; transition: all 0.2s; }
        .folder-header:hover { background: rgba(100, 181, 246, 0.1); color: #fff; }
        .folder-header .arrow { margin-left: auto; font-size: 10px; transition: transform 0.3s; }
        .folder.open > .folder-header .arrow { transform: rotate(90deg); }
        .folder.open > .folder-header { color: #64b5f6; }
        .folder-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; padding-left: 15px; border-left: 1px solid rgba(255,255,255,0.05); margin-left: 15px; }
        
        .doc { padding: 8px 10px 8px 20px; color: #64748b; cursor: pointer; font-size: 13px; border-radius: 6px; transition: all 0.2s; display: flex; align-items: center; gap: 10px; }
        .doc:hover { color: #fff; background: rgba(100, 181, 246, 0.1); }
        .doc::before { content: '📄'; font-size: 12px; }
        
        .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 40; }

        @media (max-width: 768px) {
            .menu-btn { display: block; }
            .sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .content-wrapper { padding: 20px; margin: 10px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <button id="menu-toggle" class="menu-btn">☰</button>
    <div id="overlay" class="overlay"></div>
    
    <aside id="sidebar" class="sidebar">
        <div class="logo"><span>🚁</span> FPV LAB</div>
        <div class="menu-list" id="sidebar-menu"></div>
    </aside>

    <main class="main-content">
        <!-- КАРТИНКА ДРОНА -->
        <div class="hero-image-container">
            <img src="drone.jpg" alt="Drone" class="hero-image">
        </div>

        <!-- ТЕКСТ ПО ЦЕНТРУ -->
        <div class="content-wrapper">
            <h1 id="reader-title">FPV Лаборатория</h1>
            <p id="reader-content">Выберите тему в меню слева, чтобы начать изучение материалов.</p>
        </div>
    </main>

    <script>
        function createSubfolders(name) {
            let result = [];
            for (let i = 1; i <= 10; i++) {
                result.push({ title: `📁 ${name} - Часть ${i}`, children: [] });
            }
            return result;
        }

        const structure = [
            { 
                title: "🛠 1. Основные компоненты", 
                children: [
                    { title: "📦 Рама", children: createSubfolders("Рама") },
                    { title: "⚙️ Моторы", children: createSubfolders("Моторы") },
                    { title: "🔌 ESC", children: createSubfolders("ESC") },
                    { title: "🧠 FC", children: createSubfolders("FC") },
                    { title: "📡 VTX", children: createSubfolders("VTX") },
                    { title: "📷 FPV-камера", children: createSubfolders("Камера") },
                    { title: "📻 Приёмник", children: createSubfolders("Приёмник") },
                    { title: "📶 Антенны", children: createSubfolders("Антенны") },
                    { title: "🍃 Пропеллеры", children: createSubfolders("Пропеллеры") },
                    { title: "🔋 PDB / BEC", children: createSubfolders("PDB") }
                ]
            },
            { 
                title: "🎮 2. Полётные режимы", 
                children: [
                    { title: "📐 Angle Mode", children: createSubfolders("Angle") },
                    { title: "🌅 Horizon Mode", children: createSubfolders("Horizon") },
                    { title: "🔄 Acro Mode", children: createSubfolders("Acro") },
                    { title: "🕊 Air Mode", children: createSubfolders("Air Mode") },
                    { title: "🚀 Throttle", children: createSubfolders("Throttle") },
                    { title: "↩️ Yaw", children: createSubfolders("Yaw") },
                    { title: "⬆️ Pitch", children: createSubfolders("Pitch") },
                    { title: "↔️ Roll", children: createSubfolders("Roll") },
                    { title: "💻 Simulator", children: createSubfolders("Simulator") },
                    { title: "🛰 GPS Rescue", children: createSubfolders("GPS") }
                ]
            },
            { 
                title: "📺 3. Видеосистемы и связь", 
                children: [
                    { title: "📼 Аналоговое видео", children: createSubfolders("Аналог") },
                    { title: "📺 Цифровое HD (DJI)", children: createSubfolders("DJI") },
                    { title: "🔴 Цифровое HD (HDZero)", children: createSubfolders("HDZero") },
                    { title: "⏱ Задержка", children: createSubfolders("Задержка") },
                    { title: "📻 Диапазоны частот", children: createSubfolders("Частоты") },
                    { title: "⚡ Мощность VTX", children: createSubfolders("Мощность") },
                    { title: "📡 Поляризация", children: createSubfolders("Поляризация") },
                    { title: "👓 Очки (Goggles)", children: createSubfolders("Очки") },
                    { title: "📶 Diversity", children: createSubfolders("Diversity") },
                    { title: "🛡 Помехи", children: createSubfolders("Помехи") }
                ]
            },
            { 
                title: "🔋 4. Питание и батареи", 
                children: [
                    { title: "🔋 LiPo", children: createSubfolders("LiPo") },
                    { title: "🔋 Li-Ion", children: createSubfolders("Li-Ion") },
                    { title: "🔢 Ячейки (S)", children: createSubfolders("Ячейки") },
                    { title: "📊 Ёмкость (mAh)", children: createSubfolders("Ёмкость") },
                    { title: "⏳ Время полёта", children: createSubfolders("Время") },
                    { title: "🔌 Разъёмы", children: createSubfolders("Разъёмы") },
                    { title: "⚡ Зарядка", children: createSubfolders("Зарядка") },
                    { title: "📦 Хранение", children: createSubfolders("Хранение") },
                    { title: "📉 Просадки", children: createSubfolders("Просадки") },
                    { title: "⚠️ Риски", children: createSubfolders("Риски") }
                ]
            },
            { 
                title: "🚁 5. Применение", 
                children: [
                    { title: "🏁 Гонки", children: createSubfolders("Гонки") },
                    { title: "🏄 Фристайл", children: createSubfolders("Фристайл") },
                    { title: "🎥 Cinewhoop", children: createSubfolders("Cinewhoop") },
                    { title: "🗺 Long Range", children: createSubfolders("Long Range") },
                    { title: "💥 FPV-камикадзе", children: createSubfolders("Камикадзе") },
                    { title: "🔍 Разведка", children: createSubfolders("Разведка") },
                    { title: "🚑 Поиск и спасение", children: createSubfolders("Поиск") },
                    { title: "🎬 Кинематограф", children: createSubfolders("Кино") },
                    { title: "🏗 Инспекция", children: createSubfolders("Инспекция") },
                    { title: "🎓 Обучение", children: createSubfolders("Обучение") }
                ]
            },
            { 
                title: "⚖️ 6. Безопасность и законы", 
                children: [
                    { title: "👀 Наблюдатель (VLOS)", children: createSubfolders("VLOS") },
                    { title: "📝 Регистрация", children: createSubfolders("Регистрация") },
                    { title: "📋 Экзамен", children: createSubfolders("Экзамен") },
                    { title: "🚫 Зоны полётов", children: createSubfolders("Зоны") },
                    { title: "📏 Высота", children: createSubfolders("Высота") },
                    { title: "⚖️ Ответственность", children: createSubfolders("Ответственность") },
                    { title: "📡 Помехи", children: createSubfolders("Помехи") },
                    { title: "🌧 Погода", children: createSubfolders("Погода") },
                    { title: "👨‍👩‍👧 Безопасность людей", children: createSubfolders("Люди") }
                ]
            },
            { 
                title: "💻 7. Настройка и прошивки", 
                children: [
                    { title: "🐝 Betaflight", children: createSubfolders("Betaflight") },
                    { title: "📡 ExpressLRS", children: createSubfolders("ELRS") },
                    { title: "🎛 PID", children: createSubfolders("PID") },
                    { title: "⚡ Rates", children: createSubfolders("Rates") },
                    { title: "📺 OSD", children: createSubfolders("OSD") },
                    { title: "⌨️ CLI", children: createSubfolders("CLI") },
                    { title: "🔌 Прошивка ESC", children: createSubfolders("Прошивка ESC") },
                    { title: "📊 VTX Tables", children: createSubfolders("VTX Tables") },
                    { title: "🔘 Режимы", children: createSubfolders("Режимы") },
                    { title: "🕹 Симулятор", children: createSubfolders("Симулятор") }
                ]
            },
            { 
                title: "🔧 8. Ремонт и обслуживание", 
                children: [
                    { title: "🍃 Замена пропеллера", children: createSubfolders("Пропеллер") },
                    { title: "🔌 Перепайка мотора", children: createSubfolders("Перепайка") },
                    { title: "🛠 Замена рамы", children: createSubfolders("Рама") },
                    { title: "📶 Проверка антенн", children: createSubfolders("Антенны") },
                    { title: "🧹 Чистка", children: createSubfolders("Чистка") },
                    { title: "🔩 Проверка винтов", children: createSubfolders("Винты") },
                    { title: "🧠 Диагностика FC", children: createSubfolders("Диагностика") },
                    { title: "📷 Замена камеры", children: createSubfolders("Камера") },
                    { title: "⚙️ Тест моторов", children: createSubfolders("Тест моторов") },
                    { title: "🔋 Аккумуляторы", children: createSubfolders("Аккумуляторы") }
                ]
            },
            { 
                title: "🧰 9. Сборка и пайка", 
                children: [
                    { title: "⚙️ Пайка моторов", children: createSubfolders("Пайка моторов") },
                    { title: "🔌 Пайка питания", children: createSubfolders("Пайка питания") },
                    { title: "📡 Пайка VTX", children: createSubfolders("Пайка VTX") },
                    { title: "🧠 Установка FC", children: createSubfolders("Установка FC") },
                    { title: "⚡ Проверка КЗ", children: createSubfolders("Проверка КЗ") },
                    { title: "💨 Smoke Stopper", children: createSubfolders("Smoke Stopper") },
                    { title: "📶 Антенны", children: createSubfolders("Антенны") },
                    { title: "🧵 Укладка проводов", children: createSubfolders("Провода") },
                    { title: "💻 Прошивка FC", children: createSubfolders("Прошивка FC") },
                    { title: "🚫 Тест без пропеллеров", children: createSubfolders("Тест") }
                ]
            },
            { 
                title: "🪖 10. Спецприменение", 
                children: [
                    { title: "💥 FPV-камикадзе", children: createSubfolders("Камикадзе") },
                    { title: "🗺 Дальность", children: createSubfolders("Дальность") },
                    { title: "⚖️ Нагрузка", children: createSubfolders("Нагрузка") },
                    { title: "🚀 Скорость", children: createSubfolders("Скорость") },
                    { title: "🧵 Оптоволокно", children: createSubfolders("Оптоволокно") },
                    { title: "🌙 Ночные версии", children: createSubfolders("Ночные") },
                    { title: "💰 Дешевизна", children: createSubfolders("Дешевизна") },
                    { title: "💨 Маневренность", children: createSubfolders("Маневренность") },
                    { title: "📡 РЭБ", children: createSubfolders("РЭБ") },
                    { title: "🎯 Автосопровождение", children: createSubfolders("Трекинг") }
                ]
            }
        ];

        const sidebarMenu = document.getElementById('sidebar-menu');
        const readerTitle = document.getElementById('reader-title');
        const readerContent = document.getElementById('reader-content');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuToggle = document.getElementById('menu-toggle');

        function renderMenu(items, container) {
            items.forEach(item => {
                const folder = document.createElement('div');
                folder.className = 'folder';
                
                const header = document.createElement('div');
                header.className = 'folder-header';
                header.innerHTML = `<span>${item.title}</span><span class="arrow">▶</span>`;
                
                const content = document.createElement('div');
                content.className = 'folder-content';
                
                header.addEventListener('click', (e) => {
                    e.stopPropagation();
                    folder.classList.toggle('open');
                    if(!folder.classList.contains('open')) {
                        content.style.maxHeight = null;
                    } else {
                        content.style.maxHeight = content.scrollHeight + "px";
                    }
                });
                
                folder.appendChild(header);
                folder.appendChild(content);
                container.appendChild(folder);
                
                if (item.children && item.children.length > 0) {
                    renderMenu(item.children, content);
                } else {
                    for (let i = 1; i <= 10; i++) {
                        const doc = document.createElement('div');
                        doc.className = 'doc';
                        doc.innerHTML = `<span>📄 Документ ${i}</span>`;
                        doc.addEventListener('click', (e) => {
                            e.stopPropagation();
                            readerTitle.textContent = `Документ ${i}`;
                            readerContent.textContent = `Тут будет текст документа для: ${item.title}`;
                            if(window.innerWidth <= 768) { sidebar.classList.remove('open'); overlay.style.display = 'none'; }
                        });
                        content.appendChild(doc);
                    }
                }
            });
        }

        menuToggle.addEventListener('click', () => { sidebar.classList.add('open'); overlay.style.display = 'block'; });
        overlay.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.style.display = 'none'; });

        renderMenu(structure, sidebarMenu);
    </script>
</body>
</html>
