<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FPV Лаборатория</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
        body { background-color: #0e1621; color: #fff; height: 100vh; overflow: hidden; display: flex; }
        
        .menu-btn { display: none; position: fixed; top: 15px; left: 15px; z-index: 100; background: #17212b; color: #64b5f6; border: 1px solid #242f3d; padding: 10px 15px; font-size: 20px; border-radius: 8px; cursor: pointer; }
        .sidebar { width: 340px; background: #17212b; border-right: 1px solid #242f3d; display: flex; flex-direction: column; transition: transform 0.3s; z-index: 50; }
        .logo { padding: 20px; font-size: 20px; font-weight: 900; border-bottom: 1px solid #242f3d; display: flex; align-items: center; gap: 10px; }
        .menu-list { flex: 1; overflow-y: auto; padding: 10px; }
        .main-content { flex: 1; background: #0e1621; overflow-y: auto; padding: 40px; position: relative; }
        .content-wrapper { max-width: 800px; margin: 0 auto; background: rgba(23, 33, 43, 0.8); padding: 30px; border-radius: 12px; border: 1px solid #242f3d; }
        h1 { font-size: 32px; margin-bottom: 15px; color: #64b5f6; }
        p { font-size: 16px; line-height: 1.6; color: #94a3b8; }
        
        .folder { margin-bottom: 2px; }
        .folder-header { padding: 12px 15px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; color: #94a3b8; border-radius: 8px; transition: all 0.2s; }
        .folder-header:hover { background: #202b36; color: #fff; }
        .folder-header .arrow { margin-left: auto; font-size: 10px; transition: transform 0.3s; }
        .folder.open > .folder-header .arrow { transform: rotate(90deg); }
        .folder.open > .folder-header { color: #64b5f6; }
        .folder-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; padding-left: 15px; border-left: 1px solid #242f3d; margin-left: 15px; }
        
        .doc { padding: 8px 10px 8px 20px; color: #64748b; cursor: pointer; font-size: 13px; border-radius: 6px; transition: all 0.2s; display: flex; align-items: center; gap: 10px; }
        .doc:hover { color: #fff; background: #202b36; }
        .doc::before { content: '📄'; font-size: 12px; }
        .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 40; }

        @media (max-width: 768px) {
            .menu-btn { display: block; }
            .sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { padding: 60px 15px 15px 15px; }
            .content-wrapper { padding: 20px; }
        }
    </style>
</head>
<body>
    <button id="menu-toggle" class="menu-btn">☰</button>
    <div id="overlay" class="overlay"></div>
    
    <aside id="sidebar" class="sidebar">
        <div class="logo"><span>🚁</span> FPV LAB</div>
        <div class="menu-list" id="sidebar-menu"></div>
    </aside>

    <main class="main-content">
        <div class="content-wrapper">
            <h1 id="reader-title">Добро пожаловать</h1>
            <p id="reader-content">Выберите тему в меню слева, чтобы начать.</p>
        </div>
    </main>

    <script>
        // Функция для генерации 10 подпапок с документами
        function generateSubfolders(subfolderName) {
            const docs = [];
            for (let i = 1; i <= 10; i++) {
                docs.push(`${subfolderName} - Документ ${i}`);
            }
            return docs;
        }

        // ГЛАВНАЯ СТРУКТУРА
        const structure = [
            { 
                title: "🛠 1. Основные компоненты", 
                children: [
                    { title: "📦 Рама", children: generateSubfolders("Рама") },
                    { title: "⚙️ Моторы", children: generateSubfolders("Моторы") },
                    { title: "🔌 ESC", children: generateSubfolders("ESC") },
                    { title: "🧠 FC", children: generateSubfolders("FC") },
                    { title: "📡 VTX", children: generateSubfolders("VTX") },
                    { title: "📷 FPV-камера", children: generateSubfolders("Камера") },
                    { title: "📻 Приёмник", children: generateSubfolders("Приёмник") },
                    { title: "📶 Антенны", children: generateSubfolders("Антенны") },
                    { title: "🍃 Пропеллеры", children: generateSubfolders("Пропеллеры") },
                    { title: "🔋 PDB / BEC", children: generateSubfolders("PDB") }
                ]
            },
            { 
                title: "🎮 2. Полётные режимы", 
                children: [
                    { title: "📐 Angle Mode", children: generateSubfolders("Angle Mode") },
                    { title: "🌅 Horizon Mode", children: generateSubfolders("Horizon Mode") },
                    { title: "🔄 Acro Mode", children: generateSubfolders("Acro Mode") },
                    { title: "🕊 Air Mode", children: generateSubfolders("Air Mode") },
                    { title: "🚀 Throttle", children: generateSubfolders("Throttle") },
                    { title: "↩️ Yaw", children: generateSubfolders("Yaw") },
                    { title: "⬆️ Pitch", children: generateSubfolders("Pitch") },
                    { title: "↔️ Roll", children: generateSubfolders("Roll") },
                    { title: "💻 Simulator", children: generateSubfolders("Simulator") },
                    { title: "🛰 GPS Rescue", children: generateSubfolders("GPS Rescue") }
                ]
            },
            { 
                title: "📺 3. Видеосистемы и связь", 
                children: [
                    { title: "📼 Аналоговое видео", children: generateSubfolders("Аналоговое видео") },
                    { title: "📺 Цифровое HD (DJI)", children: generateSubfolders("DJI") },
                    { title: "🔴 Цифровое HD (HDZero)", children: generateSubfolders("HDZero") },
                    { title: "⏱ Задержка", children: generateSubfolders("Задержка") },
                    { title: "📻 Диапазоны частот", children: generateSubfolders("Частоты") },
                    { title: "⚡ Мощность VTX", children: generateSubfolders("Мощность") },
                    { title: "📡 Поляризация", children: generateSubfolders("Поляризация") },
                    { title: "👓 Очки (Goggles)", children: generateSubfolders("Очки") },
                    { title: "📶 Diversity", children: generateSubfolders("Diversity") },
                    { title: "🛡 Помехоустойчивость", children: generateSubfolders("Помехи") }
                ]
            },
            { 
                title: "🔋 4. Питание и батареи", 
                children: [
                    { title: "🔋 LiPo", children: generateSubfolders("LiPo") },
                    { title: "🔋 Li-Ion", children: generateSubfolders("Li-Ion") },
                    { title: "🔢 Ячейки (S)", children: generateSubfolders("Ячейки") },
                    { title: "📊 Ёмкость (mAh)", children: generateSubfolders("Ёмкость") },
                    { title: "⏳ Время полёта", children: generateSubfolders("Время") },
                    { title: "🔌 Разъёмы", children: generateSubfolders("Разъёмы") },
                    { title: "⚡ Зарядка", children: generateSubfolders("Зарядка") },
                    { title: "📦 Хранение", children: generateSubfolders("Хранение") },
                    { title: "📉 Просадки напряжения", children: generateSubfolders("Просадки") },
                    { title: "⚠️ Риски", children: generateSubfolders("Риски") }
                ]
            },
            { 
                title: "🚁 5. Применение", 
                children: [
                    { title: "🏁 Гонки", children: generateSubfolders("Гонки") },
                    { title: "🏄 Фристайл", children: generateSubfolders("Фристайл") },
                    { title: "🎥 Cinewhoop", children: generateSubfolders("Cinewhoop") },
                    { title: "🗺 Long Range", children: generateSubfolders("Long Range") },
                    { title: "💥 FPV-камикадзе", children: generateSubfolders("Камикадзе") },
                    { title: "🔍 Разведка", children: generateSubfolders("Разведка") },
                    { title: "🚑 Поиск и спасение", children: generateSubfolders("Поиск") },
                    { title: "🎬 Кинематограф", children: generateSubfolders("Кино") },
                    { title: "🏗 Инспекция", children: generateSubfolders("Инспекция") },
                    { title: "🎓 Обучение", children: generateSubfolders("Обучение") }
                ]
            },
            { 
                title: "⚖️ 6. Безопасность и законы", 
                children: [
                    { title: "👀 Наблюдатель (VLOS)", children: generateSubfolders("VLOS") },
                    { title: "📝 Регистрация", children: generateSubfolders("Регистрация") },
                    { title: "📋 Экзамен", children: generateSubfolders("Экзамен") },
                    { title: "🚫 Зоны полётов", children: generateSubfolders("Зоны") },
                    { title: "📏 Высота", children: generateSubfolders("Высота") },
                    { title: "⚖️ Ответственность", children: generateSubfolders("Ответственность") },
                    { title: "📡 Помехи", children: generateSubfolders("Помехи") },
                    { title: "🌧 Погода", children: generateSubfolders("Погода") },
                    { title: "👨‍👩‍👧 Безопасность людей", children: generateSubfolders("Люди") }
                ]
            },
            { 
                title: "💻 7. Настройка и прошивки", 
                children: [
                    { title: "🐝 Betaflight", children: generateSubfolders("Betaflight") },
                    { title: "📡 ExpressLRS", children: generateSubfolders("ELRS") },
                    { title: "🎛 PID", children: generateSubfolders("PID") },
                    { title: "⚡ Rates", children: generateSubfolders("Rates") },
                    { title: "📺 OSD", children: generateSubfolders("OSD") },
                    { title: "⌨️ CLI", children: generateSubfolders("CLI") },
                    { title: "🔌 Прошивка ESC", children: generateSubfolders("Прошивка ESC") },
                    { title: "📊 VTX Tables", children: generateSubfolders("VTX Tables") },
                    { title: "🔘 Режимы", children: generateSubfolders("Режимы") },
                    { title: "🕹 Симулятор", children: generateSubfolders("Симулятор") }
                ]
            },
            {

                children: [
                    { title: "🍃 Замена пропеллера", children: generateSubfolders("Пропеллер") },
                    { title: "🔌 Перепайка мотора", children: generateSubfolders("Перепайка") },
                    { title: "🛠 Замена рамы", children: generateSubfolders("Рама") },
                    { title: "📶 Проверка антенн", children: generateSubfolders("Антенны") },
                    { title: "🧹 Чистка", children: generateSubfolders("Чистка") },
                    { title: "🔩 Проверка винтов", children: generateSubfolders("Винты") },
                    { title: "🧠 Диагностика FC", children: generateSubfolders("Диагностика") },
                    { title: "📷 Замена камеры", children: generateSubfolders("Камера") },
                    { title: "⚙️ Тест моторов", children: generateSubfolders("Тест моторов") },
                    { title: "🔋 Аккумуляторы", children: generateSubfolders("Аккумуляторы") }
                ]
            },
            { 
                title: "🧰 9. Сборка и пайка", 
                children: [
                    { title: "⚙️ Пайка моторов", children: generateSubfolders("Пайка моторов") },
                    { title: "🔌 Пайка питания", children: generateSubfolders("Пайка питания") },
                    { title: "📡 Пайка VTX", children: generateSubfolders("Пайка VTX") },
                    { title: "🧠 Установка FC", children: generateSubfolders("Установка FC") },
                    { title: "⚡ Проверка КЗ", children: generateSubfolders("Проверка КЗ") },
                    { title: "💨 Smoke Stopper", children: generateSubfolders("Smoke Stopper") },
                    { title: "📶 Антенны", children: generateSubfolders("Антенны") },
                    { title: "🧵 Укладка проводов", children: generateSubfolders("Провода") },
                    { title: "💻 Прошивка FC", children: generateSubfolders("Прошивка FC") },
                    { title: "🚫 Тест без пропеллеров", children: generateSubfolders("Тест") }
                ]
            },
            { 
                title: "🪖 10. Спецприменение", 
                children: [
                    { title: "💥 FPV-камикадзе", children: generateSubfolders("Камикадзе") },
                    { title: "🗺 Дальность", children: generateSubfolders("Дальность") },
                    { title: "⚖️ Нагрузка", children: generateSubfolders("Нагрузка") },
                    { title: "🚀 Скорость", children: generateSubfolders("Скорость") },
                    { title: "🧵 Оптоволокно", children: generateSubfolders("Оптоволокно") },
                    { title: "🌙 Ночные версии", children: generateSubfolders("Ночные") },
                    { title: "💰 Дешевизна", children: generateSubfolders("Дешевизна") },
                    { title: "💨 Маневренность", children: generateSubfolders("Маневренность") },
                    { title: "📡 РЭБ", children: generateSubfolders("РЭБ") },
                    { title: "🎯 Автосопровождение", children: generateSubfolders("Трекинг") }
                ]
            }
        ];

        const sidebarMenu = document.getElementById('sidebar-menu');
        const readerTitle = document.getElementById('reader-title');
        const readerContent = document.getElementById('reader-content');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuToggle = document.getElementById('menu-toggle');

        // Рекурсивная функция отрисовки меню (теперь может обрабатывать 3 уровня)
        function renderMenu(items, container) {
            items.forEach(item => {
                if (item.children) {
                    const folder = document.createElement('div');
                    folder.className = 'folder';
                    
                    const header = document.createElement('div');
                    header.className = 'folder-header';
                    
                    // Если это верхний уровень (эмодзи уже в названии), выводим как есть
                    // Для внутренних уровней тоже выводим текст как есть
                    header.innerHTML = `<span>${item.title.substring(0,2)}</span><span>${item.title.substring(2)}</span><span class="arrow">▶</span>`;
                    
                    const content = document.createElement('div');
                    content.className = 'folder-content';
                    
                    header.addEventListener('click', (e) => {
                        e.stopPropagation();
                        folder.classList.toggle('open');
                        if(!folder.classList.contains('open')) {
                            content.style.maxHeight = null;
                        } else {
                            content.style.maxHeight = content.scrollHeight + "px";
                        }
                    });
                    
                    folder.appendChild(header);
                    folder.appendChild(content);
                    container.appendChild(folder);
                    
                    // Рекурсивный вызов для вложенных папок
                    renderMenu(item.children, content);
                } else {
                    const doc = document.createElement('div');
                    doc.className = 'doc';
                    doc.innerHTML = `<span></span> <span>${item.title}</span>`;
                    
                    doc.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const cleanTitle = item.title.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').trim();
                        readerTitle.textContent = item.title;
                        readerContent.textContent = `Тут будет содержимое файла: ${cleanTitle}.docx`;
                        if(window.innerWidth <= 768) { sidebar.classList.remove('open'); overlay.style.display = 'none'; }
                    });
                    container.appendChild(doc);
                }
            });
        }

        menuToggle.addEventListener('click', () => { sidebar.classList.add('open'); overlay.style.display = 'block'; });
        overlay.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.style.display = 'none'; });

        renderMenu(structure, sidebarMenu);
    </script>
</body>
</html>
